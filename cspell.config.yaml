version: "0.2"
ignorePaths:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/.git/**"
  - "**/.svn/**"
  - "**/.hg/**"
  - "**/coverage/**"
  - "**/tmp/**"
  - "**/.tmp/**"
  - "**/.log/**"
dictionaryDefinitions: []
dictionaries:
  - en-gb
  - en-uk
  - softwareTerms
  - misc
  - typescript
  - bash
  - npm
words:
  - anseki
  - APIKEY
  - bierner
  - chatmodes
  - csslint
  - datamodel
  - davidanson
  - dependencygraph
  - devcontainers
  - donjayamanne
  - dont
  - eamodio
  - esbenp
  - esmodules
  - foundrydata
  - foundryvtt
  - geistmann
  - githistory
  - iarna
  - jannisx
  - maciejdems
  - mhutchie
  - omhrc
  - parseable
  - perkovec
  - Placeables
  - Schmalfeldt
  - speckit
  - stylelintcache
  - yzhang
overrides:
  - filename: "**/*.mjs"
    ignoreWords:
      - foundryvtt
      - placeable
      - placeables
  - filename: "**/*.yaml"
    ignoreWords:
      - foundry
      - dont
  - filename: "**/*.md"
    ignoreWords:
      - foundry
      - deployments
      - modularity
    flagWords:
      - dont
      - APIKEY
  - filename: "**/*.json"
    ignoreWords: []
  - filename: "**/*.css"
    ignoreWords:
      - placeable
import: []
