# file: placeables.yaml
# description: Configuration constants for placeable objects in Foundry VTT
# path: src/config/constants/placeables.yaml

# Constants relative to placeables
placeables:
  token:
    type: 'token'
    name: 'Token'
    class: 'TokenDocument'
    allowedCorners:
      - 'top-left'
      - 'top-right'
      - 'bottom-left'
      - 'bottom-right'
  tile:
    type: 'tile'
    name: 'Tile'
    class: 'TileDocument'
    allowedCorners:
      - 'top-left'
      - 'top-right'
      - 'bottom-left'
      - 'bottom-right'

# Configuration for PositionChecker (keys/types can be overridden here)
positionChecker:
  checkTypes:
    UNDER: 'under'
    OVER: 'above' # Overrides default 'over' for elevation checks
  positionUses:
    CENTER: 'center'
    RECTANGLE: 'rectangle'
  methodKeys:
    CENTER_RECTANGLE: 'center-rectangle'
    RECTANGLE_CENTER: 'rectangle-center'
    RECTANGLE_RECTANGLE: 'rectangle-rectangle'
    CENTER_CENTER: 'center-center'
