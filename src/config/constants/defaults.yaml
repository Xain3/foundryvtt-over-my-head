# @file defaults.yaml
# @description Runtime configuration settings for the Over My Head module
# @path src/config/constants/defaults.yaml

logging:
  moduleName: OMH
  level: info
  debugMode: false
  colorize: true
  timestamp:
    enabled: true
    format: iso
  format:
    error: '[{module}] ERROR | {timestamp} | {message}'
    warn: '[{module}] WARN | {timestamp} | {message}'
    info: '[{module}] {message}'
    verbose: '[{module}] VERBOSE | {message}'
    debug: '[{module}] DEBUG | {timestamp} | {message} | {metadata}'

paths:
  foundryDataDirPath:
    linux:
      - '/home/${user}/.local/share/FoundryVTT'
      - '/home/${user}/FoundryVTT'
      - '/local/FoundryVTT'
  darwin: # macOS path construction requires proper joining
    - '${getHomeDir(user)}/Library/Application Support/FoundryVTT'
  win32: # Windows uses LOCALAPPDATA environment variable
    - '${getLocalAppData()}/FoundryVTT'
